name: Deploy to Vultr

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - run: npm ci
      - run: npm test
      - run: npm run build

      - name: Setup SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$SSH_HOST" >> ~/.ssh/known_hosts

      # The server side is deploy/setup-server.sh: the key of SSH_USER (deploy) is
      # locked to `rrsync /opt/uchikartuli`, so `site/` is /opt/uchikartuli/site,
      # which the site's own Caddy serves. --delay-updates swaps the new files in
      # at the end, so index.html never points at bundles that are not there yet.
      - name: Rsync dist/ to server
        env:
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
        run: |
          rsync -rlptz --chmod=D755,F644 --delete --delay-updates --stats \
            -e "ssh -i ~/.ssh/id_ed25519" \
            dist/ "$SSH_USER@$SSH_HOST:site/"
